services:
  horizon:
    build:
      context: .
      # args:
      #   EXTRAS: trafilatura  # comma-separated optional extras, e.g. "trafilatura,openbb"
    container_name: horizon
    volumes:
      - ./data:/app/data
      - ./docs:/app/docs
      - ./.env:/app/.env:ro
    environment:
      - TZ=UTC
      # Proxy for blocked sources (Reddit/Telegram); set HTTP_PROXY in .env
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1}
    restart: "no"
    # Run daily at 8:00 AM UTC (adjust as needed)
    # For one-time run, use: docker compose run --rm horizon
    command: ["--hours", "24"]
